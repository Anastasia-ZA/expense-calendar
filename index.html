<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платежный календарь</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); padding: 15px; }
        .invoice-card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: var(--tg-theme-secondary-bg-color, rgba(0,0,0,0.05)); }
        .amount { font-weight: bold; color: #2ecc71; font-size: 1.1em; margin: 5px 0; }
        .org { font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>
    <h2>Мои долги</h2>
    <div id="list">Загрузка данных...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const list = document.getElementById('list');

        // Отправляем запрос на наш Python-сервер
        async function loadData() {
            try {
                // ВАЖНО: замените localhost:8000 на реальный адрес вашего API
                const response = await fetch("https://5d9ku30t4y.apps.bot-hosting.cloud/api/get_invoices", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ initData: tg.initData })
                });
                
                const result = await response.json();
                
                if (result.error) {
                    list.innerHTML = `<p style="color:red;">${result.error}</p>`;
                    return;
                }

                list.innerHTML = '';
                result.invoices.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'invoice-card';
                    div.innerHTML = `
                        <div class="org">${item.org}</div>
                        <div class="amount">${item.amount.toFixed(2)} ${item.currency}</div>
                        <div>Оплатить до: ${item.due_date}</div>
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                list.innerHTML = '<p style="color:red;">Ошибка соединения с сервером.</p>';
            }
        }

        loadData();
    </script>
</body>
</html>
