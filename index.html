<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платежный календарь</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); padding: 15px; }
        .invoice-card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: var(--tg-theme-secondary-bg-color, rgba(0,0,0,0.05)); position: relative; transition: opacity 0.5s; }
        .amount { font-weight: bold; color: #2ecc71; font-size: 1.1em; margin: 5px 0; }
        .org { font-weight: bold; font-size: 1.1em; }
        .pay-btn { background-color: #2ecc71; color: white; border: none; padding: 8px 12px; border-radius: 5px; margin-top: 10px; cursor: pointer; font-weight: bold; width: 100%; }
        .pay-btn:active { background-color: #27ae60; }
        .loading-text { text-align: center; color: gray; }
    </style>
</head>
<body>
    <h2>Мои долги</h2>
    <div id="list" class="loading-text">Загрузка данных...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const list = document.getElementById('list');
        const API_URL = "https://5d9ku30t4y.apps.bot-hosting.cloud"; 

        async function loadData() {
            try {
                const response = await fetch(`${API_URL}/api/get_invoices`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ initData: tg.initData })
                });
                
                const result = await response.json();
                
                if (result.error) {
                    list.innerHTML = `<p style="color:red;">${result.error}</p>`;
                    return;
                }

                list.innerHTML = '';
                list.classList.remove('loading-text');

                if (result.invoices.length === 0) {
                    list.innerHTML = '<p>Нет долгов! 🎉</p>';
                    return;
                }

                result.invoices.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'invoice-card';
                    div.id = `card-${item.id}`;
                    div.innerHTML = `
                        <div class="org">${item.org}</div>
                        <div class="amount">${item.amount.toFixed(2)} ${item.currency}</div>
                        <div>Оплатить до: ${item.due_date}</div>
                        <button class="pay-btn" onclick="payInvoice(${item.id})">✅ Оплатить</button>
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                list.innerHTML = '<p style="color:red;">Ошибка соединения с сервером.</p>';
            }
        }

        async function payInvoice(invoiceId) {
            const card = document.getElementById(`card-${invoiceId}`);
            if (card) card.style.opacity = '0.5';

            try {
                const response = await fetch(`${API_URL}/api/pay_invoice`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ initData: tg.initData, invoice_id: invoiceId })
                });
                
                const result = await response.json();
                
                if (result.error) {
                    alert(result.error);
                    if (card) card.style.opacity = '1';
                    return;
                }

                // Красиво скрываем карточку после оплаты
                if (card) {
                    card.style.display = 'none';
                }
            } catch (e) {
                alert("Ошибка при отправке данных.");
                if (card) card.style.opacity = '1';
            }
        }

        loadData();
    </script>
</body>
</html>
