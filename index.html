<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платежный календарь</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); padding: 15px; }
        .invoice-card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: var(--tg-theme-secondary-bg-color, rgba(0,0,0,0.05)); }
        .amount { font-weight: bold; color: #2ecc71; font-size: 1.1em; margin: 5px 0; }
        .org { font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>
    <h2>Мои долги</h2>
    <div id="list">Загрузка данных...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // В реальном приложении здесь будет запрос к боту. 
        // Пока мы просто сгенерируем карточки из данных, которые вставим позже.
        // Для теста мы просто оставляем красивый вывод.
        const list = document.getElementById('list');
        list.innerHTML = '<p style="text-align:center; color: gray;">Связь с базой данных настраивается...</p>';
    </script>
</body>
</html>
